<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">

    <meta name="theme-color" content="#e6f9ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1017" media="(prefers-color-scheme: dark)">

    <meta name="view-transition" content="same-origin" />

    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>

    <title>기록된 이야기 목록 - Team HC</title>

    <link rel="icon" href="../favicon.webp" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 공통 -->
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../tabbar.css">

    <!-- 페이지 전용 (toast.css 삭제) -->
    <link rel="stylesheet" href="games.css">
</head>

<body>
    <div class="container">

        <div class="top-bar">
            <button class="icon-btn back-btn" id="backBtn" aria-label="뒤로 가기" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <button class="icon-btn theme-btn" id="themeBtn" aria-label="다크모드 전환">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>

        <h1>기록된 이야기 목록</h1>
        <p class="description">
            Team HC에서 발매한 게임의 목록입니다.<br>
            게임을 선택하면 상세 페이지로 이동합니다.
        </p>

        <div class="link-group"></div>
    </div>

    <nav class="bottom-tabbar" role="navigation" aria-label="하단 탭바">
        <div class="seg-group">
            <button class="active" data-tab="project">프로젝트순</button>
            <button data-tab="latest">최신순</button>
            <button data-tab="name">가나다순</button>
        </div>
    </nav>

    <script src="../theme.js"></script>
    <script src="games.js"></script>
    <script src="../tabbar.js"></script>
</body>
</html>
