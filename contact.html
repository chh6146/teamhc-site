<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">

    <meta name="theme-color" content="#e6f9ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a1017" media="(prefers-color-scheme: dark)">

    <meta name="view-transition" content="same-origin" />

    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>

    <title>문의 - Team HC</title>
    <meta name="description" content="Team HC 프로젝트 협업 및 버그 제보 문의">

    <link rel="icon" href="favicon.webp" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <style>
        /* ==========================================
           문의 페이지 전용
           ========================================== */
        .container {
            text-align: left;
            max-width: 560px;
        }

        .contact-title {
            margin: 0 0 20px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.02em;
            text-align: center;
        }

        .contact-intro {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.7;
            margin: 0 0 24px;
            text-align: center;
        }

        .contact-list {
            list-style: none;
            padding: 0;
            margin: 0 0 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            transition: border-color var(--t-base), background var(--t-base);
        }

        .contact-list li:hover {
            border-color: var(--primary-border);
            background: var(--hover-bg);
        }

        .contact-list .bullet {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
            flex-shrink: 0;
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        /* 이메일 라인 */
        .email-line {
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-sub);
            margin: 0 0 20px;
            padding: 0;
            line-height: 1.6;
        }

        .email-label {
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 4px;
        }

        #contact-email {
            color: var(--text-main);
            font-weight: 600;
            word-break: break-all;
        }

        .notice {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.6;
            text-align: center;
            margin: 0;
            padding: 0 8px;
        }

        /* noscript 박스 */
        .noscript-box {
            padding: 14px 18px;
            background: var(--surface);
            border: 1px dashed var(--border-light);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="top-bar">
            <button class="icon-btn back-btn" id="backBtn" aria-label="뒤로 가기" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 15 12 9 18 15"/>
                </svg>
            </button>
        </div>

        <h1 class="contact-title">문의</h1>

        <p class="contact-intro">
            프로젝트 관련 협업 및 버그 제보는<br>
            아래 공식 메일 주소를 이용해 주시기 바랍니다.
        </p>

        <ul class="contact-list">
            <li><span class="bullet"></span>일러스트레이터 지원</li>
            <li><span class="bullet"></span>버그 제보</li>
        </ul>

        <p class="email-line">
            <span class="email-label">Email:</span>
            <span id="contact-email">로딩 중...</span>
        </p>

        <noscript>
            <div class="noscript-box">
                자바스크립트가 비활성화되어 있습니다.<br>
                이메일 주소: contact[at]teamhc[dot]net
            </div>
        </noscript>

        <p class="notice">
            ※ 모든 문의는 수신 순서에 따라 순차적으로 답변드리고 있습니다.<br>
            문의 내용은 '새로운 소식'에 게재될 수 있습니다.
        </p>
    </div>

    <script>window.BACK_FALLBACK = 'index.html';</script>
    <script src="theme.js"></script>
    <script src="security.js"></script>
</body>
</html>
